{% extends "productos/base.html" %}

{% block contenido %}
<div class="container mt-4">
    <h2>Productos registrados</h2>
    <a href="{% url 'productos:crear'%}" class="btn btn-success mb-3">Nuevo Producto</a>

    <a href="{% url 'productos:inventario_lista' %}" class="btn btn-secondary mb-3">Ver inventario</a>
</div>

<div class="container">
    <table class="table table-hover table-bordered">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for producto in productos %}
        <tr>
            <td>{{ producto.nombre }}</td>
            <td>${{ producto.precio }}</td>
            <td>
                <a href="{% url 'productos:editar' producto.pk %}" class="btn btn-success">Editar</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">
                No hay productos registrados.
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>

{% endblock %}
